name: Deploy to GitHub Pages

# Static site, no build step: publish the repo root as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check sources
        run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r assets src vendor _site/
          touch _site/.nojekyll
          # Cache-bust every local script and stylesheet with the commit SHA so
          # browsers (phones especially) fetch new code after each deploy.
          V="${GITHUB_SHA::7}"
          sed -E "s#(src|href)=\"((src|assets|vendor)/[^\"?]+)\"#\1=\"\2?v=$V\"#g" index.html > _site/index.html
          grep -c "?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
